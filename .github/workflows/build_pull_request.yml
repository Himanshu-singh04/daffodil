name: Daffodil Build PR

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read
  id-token: write # remote Nx cache (GitHub OIDC); fork PRs get no token and build without it

jobs:
  build:
    name: Build PR
    uses: ./.github/workflows/build.yml
    with:
      cache-mode: 'read-only'
      ref: ${{ github.event.pull_request.head.sha }}
    secrets:
      NX_CACHE_RELEASE_TOKEN: ${{ secrets.NX_CACHE_RELEASE_TOKEN }}

  build-success:
    name: Build PR Success
    runs-on: ubuntu-latest
    needs: [build]
    if: always()
    steps:
      - name: Check build result
        run: |
          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "Build did not succeed (result: ${{ needs.build.result }})"
            exit 1
          fi


